# Projeto para o XcodeGen: `brew install xcodegen && xcodegen generate`.
#
# O .xcodeproj é gerado, e não versionado, porque é um arquivo enorme que dá
# conflito em qualquer merge. Este YAML é a fonte da verdade.
name: Levanta
options:
  bundleIdPrefix: br.com
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Levanta:
    type: application
    platform: iOS
    sources:
      - Levanta
    info:
      path: Levanta/Info.plist
      properties:
        CFBundleDisplayName: Levanta
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: >-
          A câmera conta as repetições do exercício que desliga o alarme.
          As imagens são analisadas no próprio aparelho e nunca saem dele.
        # `audio` é o que permite o alarme continuar tocando com a tela apagada
        # e durante o exercício, além dos 30 s da notificação.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.levanta
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    entitlements:
      path: Levanta/Levanta.entitlements
      properties:
        # O alerta crítico só funciona com autorização específica da Apple,
        # pedida em https://developer.apple.com/contact/request/notifications-critical-alerts
        # Sem ela o app continua funcionando, mas o alarme respeita o silencioso.
        com.apple.developer.usernotifications.critical-alerts: true

  LevantaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LevantaTests
    dependencies:
      - target: Levanta

schemes:
  Levanta:
    build:
      targets:
        Levanta: all
        LevantaTests: [test]
    test:
      targets:
        - LevantaTests
