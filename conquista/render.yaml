# Blueprint do Render: sobe o jogo com WebSocket funcionando, sem mexer no codigo.
# No painel do Render: New > Blueprint > aponte para este repositorio.
services:
  - type: web
    name: conquista-e-capital
    runtime: node
    plan: free
    rootDir: conquista
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
